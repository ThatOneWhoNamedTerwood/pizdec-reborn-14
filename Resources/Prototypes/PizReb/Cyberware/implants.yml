    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: fireball
      shader: unshaded
  - type: Explosive
    explosionType: CyberwareImpact
    totalIntensity: 6
    intensitySlope: 2
    maxIntensity: 2
  - type: TriggerOnCollide
    fixtureID: projectile
  - type: ExplodeOnTrigger
  - type: DeleteOnTrigger




